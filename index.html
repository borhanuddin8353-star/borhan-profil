<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BORHAN UDDIN | Digital Profile</title><style>
:root{--g:#d7b45a;--c:#f7f0df}*{box-sizing:border-box}body{margin:0;padding:24px 14px;background:radial-gradient(circle at top,#332916,#101010 48%);color:var(--c);font-family:system-ui,Arial,sans-serif}.card{max-width:560px;margin:auto;background:#191919;border:1px solid #9e8138;border-radius:26px;padding:28px 22px;text-align:center}.avatar{width:92px;height:92px;border:2px solid var(--g);border-radius:50%;display:grid;place-items:center;margin:auto;color:var(--g);font-size:30px;font-weight:800}.gold{color:var(--g)}h1{overflow-wrap:anywhere}.bio{white-space:pre-wrap;line-height:1.7}.item{text-align:left;padding:12px 0}.label{font-size:12px;letter-spacing:1px;color:var(--g)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.btn{padding:13px 8px;border:1px solid var(--g);border-radius:12px;color:var(--g);text-decoration:none;font-weight:bold}.primary{background:var(--g);color:#17130a}.hide{display:none!important}</style></head><body><main class="card">
<div class="avatar" id="avatar">BU</div><p class="gold">PERSONAL PROFILE</p><h1 id="name">BORHAN UDDIN</h1><p class="gold">DIGITAL VISITING CARD</p><p id="bio" class="bio"></p><hr style="border-color:#9e8138">
<div class="item"><div class="label">PHONE</div><div id="phone">01922141412</div></div><div class="item"><div class="label">ADDRESS</div><div id="address">কৃষ্ণনগর, ঝিকরগাছা, যশোর</div></div>
<div class="actions"><a class="btn primary" id="call" href="tel:+8801922141412">Call Me</a><a class="btn" id="wa" href="https://wa.me/8801922141412">WhatsApp</a><a class="btn" href="contact.vcf" download>Save Contact</a><a class="btn hide" id="fb" target="_blank" rel="noopener">Facebook</a><a class="btn hide" id="ig" target="_blank" rel="noopener">Instagram</a><a class="btn hide" id="mail">Email</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="PASTE_SUPABASE_PROJECT_URL_HERE", SUPABASE_ANON_KEY="PASTE_SUPABASE_ANON_KEY_HERE";
(async()=>{if(SUPABASE_URL.startsWith("PASTE_")||SUPABASE_ANON_KEY.startsWith("PASTE_"))return;try{const s=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data}=await s.from("profiles").select("*").eq("id",1).single();if(!data)return;for(const k of ["name","phone","address","bio"])if(data[k])document.getElementById(k).textContent=data[k];if(data.photo_url)document.getElementById("avatar").innerHTML='<img style="width:100%;height:100%;object-fit:cover;border-radius:50%" src="'+data.photo_url+'" alt="Profile">';if(data.phone){let n=data.phone.replace(/\D/g,"");if(n.startsWith("0"))n="88"+n;document.getElementById("call").href="tel:+"+n;document.getElementById("wa").href="https://wa.me/"+n}for(const [id,key] of [["fb","facebook_url"],["ig","instagram_url"]])if(data[key]){let e=document.getElementById(id);e.href=data[key];e.classList.remove("hide")}if(data.email){let e=document.getElementById("mail");e.href="mailto:"+data.email;e.textContent="Email";e.classList.remove("hide")}}catch(e){console.log(e)}})();
</script></body></html>
