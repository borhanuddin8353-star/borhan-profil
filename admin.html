<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | BORHAN UDDIN</title><style>
body{margin:0;padding:20px 14px;background:#101010;color:#f7f0df;font-family:system-ui,Arial,sans-serif}.box{max-width:600px;margin:auto;background:#1b1b1b;border:1px solid #d7b45a;border-radius:20px;padding:22px}h1,label{color:#d7b45a}label{display:block;margin:13px 0 5px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #6b5a2e;background:#101010;color:#fff;font:inherit}textarea{min-height:80px}button,a{display:inline-block;margin-top:14px;padding:12px 15px;border-radius:10px;border:1px solid #d7b45a;background:#d7b45a;color:#17130a;font-weight:bold;text-decoration:none}.hide{display:none!important}#msg{overflow-wrap:anywhere;white-space:pre-wrap}</style></head><body><main class="box"><a href="./">প্রোফাইল দেখুন</a><h1>Admin Panel</h1><p>Supabase সেটআপ শেষ করে লগইন করুন।</p>
<div id="login"><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">লগইন</button></div>
<div id="editor" class="hide"><label>নাম</label><input id="name"><label>ফোন</label><input id="phone"><label>ঠিকানা</label><input id="address"><label>পরিচিতি</label><textarea id="bio"></textarea><label>ছবির Public URL</label><input id="photo_url" type="url"><label>Facebook URL</label><input id="facebook_url" type="url"><label>Instagram URL</label><input id="instagram_url" type="url"><label>ইমেইল</label><input id="email_public" type="email"><button id="saveBtn">তথ্য সংরক্ষণ</button><button id="logoutBtn">লগআউট</button></div><p id="msg"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="PASTE_SUPABASE_PROJECT_URL_HERE", SUPABASE_ANON_KEY="PASTE_SUPABASE_ANON_KEY_HERE";const $=x=>document.getElementById(x);let s=null;
function setup(){if(SUPABASE_URL.startsWith("PASTE_")||SUPABASE_ANON_KEY.startsWith("PASTE_")){$("msg").textContent="আগে README অনুযায়ী Supabase URL ও anon/publishable key বসান।";return false}s=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);return true}
async function editor(){let {data:{session}}=await s.auth.getSession();$("login").classList.toggle("hide",!!session);$("editor").classList.toggle("hide",!session);if(session){let {data,error}=await s.from("profiles").select("*").eq("id",1).single();if(error){$("msg").textContent=error.message;return}for(let k of ["name","phone","address","bio","photo_url","facebook_url","instagram_url"])$(k).value=data[k]||"";$("email_public").value=data.email||"";$("msg").textContent="লগইন সফল। তথ্য পরিবর্তন করে সংরক্ষণ করুন।"}}
$("loginBtn").onclick=async()=>{if(!s&&!setup())return;let {error}=await s.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){$("msg").textContent="লগইন হয়নি: "+error.message;return}editor()};
$("saveBtn").onclick=async()=>{let p={id:1,name:$("name").value.trim(),phone:$("phone").value.trim(),address:$("address").value.trim(),bio:$("bio").value.trim(),photo_url:$("photo_url").value.trim()||null,facebook_url:$("facebook_url").value.trim()||null,instagram_url:$("instagram_url").value.trim()||null,email:$("email_public").value.trim()||null};let {error}=await s.from("profiles").upsert(p);$("msg").textContent=error?"সংরক্ষণ হয়নি: "+error.message:"তথ্য সংরক্ষিত হয়েছে। প্রোফাইল পেজ খুলে দেখুন।"};
$("logoutBtn").onclick=async()=>{await s.auth.signOut();editor()};if(setup())editor();
</script></body></html>
